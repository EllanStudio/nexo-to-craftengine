name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core:
    name: Build & test (core)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      - name: Build CLI (release)
        run: cargo build --release
      - name: Upload Linux CLI
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nexo2ce-linux
          path: target/release/nexo2ce
      - name: Upload Windows CLI
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nexo2ce-windows-cli
          path: target/release/nexo2ce.exe

  gui:
    name: Build (egui GUI, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Build GUI
        run: cargo build --verbose --features gui
      - name: Build GUI (release)
        run: cargo build --release --features gui
      - name: Upload Windows GUI + CLI
        uses: actions/upload-artifact@v4
        with:
          name: nexo2ce-windows
          path: |
            target/release/nexo2ce.exe
            target/release/nexo2ce-gui.exe