[package]
name = "nexo2ce"
version = "0.2.0"
edition = "2021"
description = "Semantics-aware Nexo 1.26 to CraftEngine 26.8 converter (Rust rewrite)"
repository = "https://github.com/EllanStudio/nexo-to-craftengine"
license = "MIT"
publish = false

[lib]
name = "nexo2ce"
path = "src/lib.rs"

[[bin]]
name = "nexo2ce"
path = "src/main.rs"

[[bin]]
name = "nexo2ce-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:eframe", "dep:egui", "dep:rfd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9.34"
thiserror = "2"
walkdir = "2"
regex = "1"
unicode-normalization = "0.1"
pathdiff = "0.2"
zip = { version = "8", default-features = false, features = ["deflate"] }

# egui/eframe 0.34+ use the App::ui(&mut egui::Ui) trait method and the
# unified egui::Panel builder (TopBottomPanel/SidePanel were removed).
eframe = { version = "0.36", optional = true }
egui = { version = "0.36", optional = true }
rfd = { version = "0.17", optional = true }

[profile.release]
lto = true
strip = true
